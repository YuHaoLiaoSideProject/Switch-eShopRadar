name: Deploy — GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只允許一個部署，跳過併發的部署任務
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run crawler
        run: npm run -w @eshop/crawler start
        env:
          CATALOG_URL: https://www.nintendo.com/tw/software/switch
          PRICE_API_URL: https://api.ec.nintendo.com/v1/price
          DATA_DIR: ./data
          COUNTRY: TW
          LANG: zh
          OPENCRITIC_API_KEY: ${{ secrets.OPENCRITIC_API_KEY }}
          OPENCRITIC_SEARCH_LIMIT: '10'

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
