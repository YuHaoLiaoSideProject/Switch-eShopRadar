name: Crawler — Daily Price Fetch

on:
  schedule:
    # 每日 UTC 02:00（台灣時間 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch: # 手動觸發

permissions:
  contents: write # 需要 push commit 回 repo

jobs:
  crawl:
    name: Fetch eShop prices
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run crawler
        run: npm run -w crawler start
        env:
          CATALOG_URL: https://www.nintendo.com/tw/software/switch
          PRICE_API_URL: https://api.ec.nintendo.com/v1/price
          DATA_DIR: ./data
          COUNTRY: TW
          LANG: zh
          OPENCRITIC_API_KEY: ${{ secrets.OPENCRITIC_API_KEY }}
          OPENCRITIC_SEARCH_LIMIT: '10'  # 搜尋上限（免費方案 25 次/天，保留 buffer）

      - name: Check for changes
        id: changes
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No price changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Price changes detected"
          fi

      - name: Commit & push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update eShop prices $(date -u +%Y-%m-%d)"
          git push
