name: CI — Test & Type Check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check — shared
        run: npm run -w @eshop/shared typecheck 2>/dev/null || echo "No typecheck script — skipping"

      - name: Type check — crawler
        run: npm run -w @eshop/crawler typecheck

      - name: Type check — web
        run: npm run -w @eshop/web typecheck

      - name: Test — shared
        run: npm run -w @eshop/shared test 2>/dev/null || echo "No test script — skipping"

      - name: Test — crawler
        run: npm run -w @eshop/crawler test

      - name: Test — web
        run: npm run -w @eshop/web test
